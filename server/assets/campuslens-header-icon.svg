  <circle cx="58" cy="57" r="27" fill="#ffffff" stroke="url(#accent)" stroke-width="9"/>
  <path d="M75 75l22 22" fill="none" stroke="url(#accent)" stroke-width="11" stroke-linecap="round"/>
  <path d="M42 58h32" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <path d="M47 55l11-10 11 10" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50 65v-8M58 65v-8M66 65v-8" fill="none" stroke="#4f46e5" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="88" cy="34" r="6" fill="#06b6d4"/>
