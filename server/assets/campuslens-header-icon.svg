<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">CampusLens header icon</title>
  <desc id="desc">A simple modern campus search lens mark in a rounded square.</desc>
  <defs>
    <linearGradient id="tile" x1="20" y1="16" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="accent" x1="32" y1="27" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="0.58" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="softShadow" x="-18%" y="-14%" width="136%" height="144%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="108" height="108" rx="30" fill="url(#tile)" filter="url(#softShadow)"/>
